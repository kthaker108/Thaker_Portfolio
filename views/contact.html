<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
        (function () {
            var stored = localStorage.getItem("theme");
            var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Khushi Thaker">
    <meta name="keywords" content="Carnegie Mellon University, Information Systems">
    <meta name="description" content="Khushi Thaker professional website">
    <link rel="stylesheet" href="../static/style.css">
    <script defer src="../static/script.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&family=Space+Grotesk:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Khushi Thaker — Contact</title>
</head>
<body>

    <div class="bg-ambient" aria-hidden="true">
        <div class="blob-wrap wrap-1"><span class="blob blob-1"></span></div>
        <div class="blob-wrap wrap-2"><span class="blob blob-2"></span></div>
        <div class="blob-wrap wrap-3"><span class="blob blob-3"></span></div>
        <div class="blob-wrap wrap-4"><span class="blob blob-4"></span></div>
    </div>

    <header class="site-header">
        <div class="nav-inner">
            <h1 id="webname">Khushi Thaker</h1>
            <nav>
                <ul class="nav-links">
                    <li><a class="webLinks" href="../index.html">Home</a></li>
                    <li><a class="webLinks" href="cv.html">Experience</a></li>
                    <li><a class="webLinks" href="contact.html">Contact Me</a></li>
                    <li><a class="webLinks" href="fun.html">About Me</a></li>
                </ul>
                <div class="nav-utility">
                    <button id="themeToggle" type="button" aria-label="Toggle dark mode">
                        <i class="fa-solid fa-moon"></i>
                        <i class="fa-solid fa-sun"></i>
                    </button>
                    <div class="hamburger-menu" aria-label="Toggle menu">
                        <i class="fas fa-bars"></i>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="page-header" data-animate>
            <span class="eyebrow">Let's talk</span>
            <h2>Contact Me</h2>
        </div>

        <div class="contact-grid">
            <div class="card" data-animate>
                <h3>Reach Me</h3>
                <div class="contact-methods">
                    <div class="contact-method">
                        <i class="fa-solid fa-envelope"></i>
                        <a href="mailto:kthaker@andrew.cmu.edu">kthaker@andrew.cmu.edu</a>
                    </div>
                    <div class="contact-method">
                        <i class="fa-solid fa-phone"></i>
                        <a href="tel:+12674611955">(267) 461-1955</a>
                    </div>
                    <div class="contact-method">
                        <i class="fa-brands fa-linkedin"></i>
                        <a href="https://www.linkedin.com/in/khushi-thaker108" target="_blank" rel="noopener">linkedin.com/in/khushi-thaker108</a>
                    </div>
                </div>

                <div class="card map-card" data-animate>
                    <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d12145.395968151914!2d-79.9493551!3d40.4454121!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8834f21f58679a9f%3A0x88716b461fc4daf4!2sCarnegie%20Mellon%20University!5e0!3m2!1sen!2sus!4v1742751974959!5m2!1sen!2sus" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Carnegie Mellon University map"></iframe>
                </div>
            </div>

            <div class="card" data-animate>
                <h3>Send a Message</h3>
                <form id="formID" novalidate>
                    <div class="field">
                        <label for="name">Your Name</label>
                        <input type="text" id="name" name="name" required>
                        <span class="field-error" id="nameError"></span>
                    </div>

                    <div class="field">
                        <label for="email">Your Email</label>
                        <input type="email" id="email" name="email" required>
                        <span class="field-error" id="emailError"></span>
                    </div>

                    <div class="field">
                        <label for="comment">Your Comment</label>
                        <textarea id="comment" name="comment" rows="6" required></textarea>
                        <span class="field-error" id="commentError"></span>
                    </div>

                    <button type="submit" class="btn btn-primary">Send via Email</button>
                    <p id="errorMessage"></p>
                </form>
            </div>
        </div>
    </div>

    <footer>
        <p id="copyYear">designed ✎ᝰ and coded 👩🏻‍💻 by Khushi Thaker &copy; </p>
    </footer>

</body>
</html>
